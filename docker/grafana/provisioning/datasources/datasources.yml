apiVersion: 1

datasources:
  # ── Prometheus ──────────────────────────────────────────────────
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  # ── Loki ────────────────────────────────────────────────────────
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # Correlate Loki logs with Prometheus metrics by shared labels
      derivedFields:
        - datasourceUid: prometheus
          matcherRegex: 'transaction_id=([^\s]+)'
          name: TransactionID
          url: '$${__value.raw}'
