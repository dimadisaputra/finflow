global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: finflow
    env: local

# Alerting rules from alerts/ directory
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers: []  # No Alertmanager in local dev — alerts visible in Prometheus UI

scrape_configs:
  # ── Prometheus self-monitoring ──────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # ── FastAPI Ingestion ───────────────────────────────────────────
  # FastAPI exposes /metrics via prometheus-fastapi-instrumentator
  - job_name: finflow-ingestion
    static_configs:
      - targets: [host.docker.internal:8000]
    metrics_path: /metrics

  # ── Redpanda ────────────────────────────────────────────────────
  # Redpanda exposes Prometheus metrics on internal port 9644
  # Metric prefix: vectorized_*
  - job_name: finflow-redpanda
    static_configs:
      - targets: [redpanda:9644]

  # ── MinIO — cluster-level metrics ───────────────────────────────
  - job_name: finflow-minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [minio:9000]

  # ── MinIO — per-bucket metrics (separate endpoint) ──────────────
  - job_name: finflow-minio-bucket
    metrics_path: /minio/v2/metrics/bucket
    static_configs:
      - targets: [minio:9000]

  # ── Loki ────────────────────────────────────────────────────────
  - job_name: finflow-loki
    static_configs:
      - targets: [loki:3100]
    metrics_path: /metrics

  # ── Spark Streaming — Silver Writer ─────────────────────────────
  # Shows DOWN when Spark is not running — this is expected and useful
  # to see at a glance if the pipeline is actively consuming.
  - job_name: finflow-silver-writer
    static_configs:
      - targets: [host.docker.internal:8001]
    metrics_path: /metrics

  # ── Spark Streaming — Fraud Detection ───────────────────────────
  - job_name: finflow-fraud-detection
    static_configs:
      - targets: [host.docker.internal:8002]
    metrics_path: /metrics

  # ── Spark Streaming — Alerts Sink ───────────────────────────────
  - job_name: finflow-alerts-sink
    static_configs:
      - targets: [host.docker.internal:8003]
    metrics_path: /metrics
