# FinFlow — Local Development Stack
# All images are pinned to specific versions (AGENTS.md rule #7).
# All ARM64-compatible images verified.

# ── Shared Airflow config (DRY anchor) ───────────────────────────
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  env_file:
    - .env          # secrets — gitignored, never committed
  environment: &airflow-env
    # Non-secret config stays inline
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_FOLDER: /opt/finflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8085"
    FINFLOW_HOME: /opt/finflow
    PYTHONPATH: /opt/finflow
    DBT_TARGET: dev
    AWS_REGION: us-east-1
    MINIO_S3_ENDPOINT: "minio:9000"
    ICEBERG_REST_URI: http://iceberg-rest-catalog:8181
    KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    # Secrets — read from .env via env_file above
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
    AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
  volumes:
    - ./:/opt/finflow
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
    redpanda:
      condition: service_healthy

services:
  # ── Event Broker ────────────────────────────────────────────────
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: finflow-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
    ports:
      - "19092:19092"   # Kafka external
      - "18081:18081"   # Schema Registry external
      - "18082:18082"   # Panda Proxy external
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redpanda Console (UI)
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: finflow-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMA_REGISTRY_ENABLED: "true"
      SCHEMA_REGISTRY_URLS: http://redpanda:8081

  # Redpanda Topic Initialization
  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: finflow-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Creating Redpanda topics...';
      rpk topic create finflow.transactions.bca finflow.transactions.mandiri finflow.transactions.gopay finflow.transactions.ovo finflow.transactions.visa finflow.fraud.alerts --brokers redpanda:9092;
      echo 'All topics created';
      "

  # ── Object Storage ─────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-03-15T01-07-19Z
    container_name: finflow-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:RELEASE.2024-03-13T23-51-57Z
    env_file:
      - .env
    container_name: finflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set finflow http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY;
      mc mb finflow/finflow-bronze --ignore-existing;
      mc mb finflow/finflow-silver --ignore-existing;
      mc mb finflow/finflow-gold --ignore-existing;
      mc mb finflow/finflow-checkpoints --ignore-existing;
      echo 'All buckets created';
      "

  # ── Iceberg REST Catalog ───────────────────────────────────────
  iceberg-rest-catalog:
    image: tabulario/iceberg-rest:1.5.0
    container_name: finflow-iceberg-rest
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3a://finflow-silver/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      AWS_REGION: us-east-1

  # ── Secrets ────────────────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.16.1
    container_name: finflow-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-finflow-dev-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK

  # ── Observability ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.1
    container_name: finflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./alerts:/etc/prometheus/rules
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle

  grafana:
    image: grafana/grafana:10.4.1
    container_name: finflow-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana

  loki:
    image: grafana/loki:2.9.6
    container_name: finflow-loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki

  # ── Lineage ────────────────────────────────────────────────────
  postgres:
    image: postgres:16.2-alpine
    container_name: finflow-marquez-db
    environment:
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    ports:
      - "5432:5432"
    volumes:
      - marquez-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez -d marquez"]
      interval: 5s
      timeout: 5s
      retries: 5

  marquez:
    image: marquezproject/marquez:0.47.0
    platform: linux/amd64  # No ARM64 image available — runs under Rosetta emulation
    container_name: finflow-marquez
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      MARQUEZ_DB: marquez
      MARQUEZ_USER: marquez
      MARQUEZ_PASSWORD: marquez
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

  # ── Airflow (LocalExecutor — AGENTS.md) ──────────────────────────
  # Dedicated PostgreSQL for Airflow metadata — separated from Marquez.
  airflow-postgres:
    image: postgres:16.2-alpine
    container_name: finflow-airflow-db
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 5


  # One-shot: migrate DB + create admin user
  airflow-init:
    <<: *airflow-common
    container_name: finflow-airflow-init
    entrypoint: >
      /bin/bash -c "
      airflow db migrate &&
      airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@finflow.local --password admin &&
      echo 'Airflow init complete.'
      "
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: finflow-airflow-webserver
    command: airflow webserver
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: finflow-airflow-scheduler
    command: airflow scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  redpanda-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:
  marquez-db-data:
  airflow-db-data:
  airflow-logs:

