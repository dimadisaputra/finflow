[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finflow"
version = "0.1.0"
description = "Personal finance aggregation and fraud detection pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # FastAPI + async server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    # Kafka (async only — never kafka-python)
    "aiokafka>=0.10.0",
    # Data contracts
    "pydantic>=2.7.0",
    # PII tokenization
    "ff3>=1.0.0",
    # Data generation
    "faker>=25.0.0",
    # HTTP client (for generator)
    "httpx>=0.27.0",
    # Prometheus metrics — exposes /metrics for Grafana scraping
    "prometheus-fastapi-instrumentator>=6.1.0",
    # PySpark (for streaming + batch jobs)
    "pyspark>=3.5.0",
    # dbt (DuckDB adapter)
    "dbt-duckdb>=1.7.0",
    # Data quality
    "great-expectations>=1.0.0",
    # DuckDB
    "duckdb>=0.10.0",
    # Airflow (pinned to 2.x — DAGs use 2.x operator imports)
    "apache-airflow>=2.9.1,<3.0.0",
    #Pytest
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
    "testcontainers>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "schemas", "generator", "streaming", "jobs", "dags", "expectations"]


[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit
    "RUF",  # ruff-specific
]
ignore = [
    "S101",   # assert used in tests
    "S106",   # hardcoded password (test fixtures)
]

[tool.ruff.lint.isort]
known-first-party = ["schemas", "ingestion", "generator", "streaming", "jobs"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "aiokafka.*",
    "ff3.*",
    "faker.*",
    "pyspark.*",
    "great_expectations.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require Docker services",
    "e2e: marks end-to-end tests that require the full stack",
]
asyncio_mode = "auto"
