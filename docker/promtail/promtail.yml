server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ── Scrape ALL Docker container logs ────────────────────────────
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          # Only scrape containers in the finflow project
          - name: label
            values: ["com.docker.compose.project=finflow"]
    relabel_configs:
      # Use container name as the "app" label
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: app

      # Use the Docker Compose service name as "service" label
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service

      # Keep the log stream label (stdout / stderr)
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream

      # Add environment label
      - target_label: env
        replacement: local

    pipeline_stages:
      # Try to parse JSON logs first (Spark, FastAPI structlog output)
      - json:
          expressions:
            level: level
            message: message
            logger: logger
          # If parsing fails, skip (plain text logs pass through as-is)

      # Promote "level" to a proper label for filtering in Grafana
      - labels:
          level:
          logger:

      # Drop noisy healthcheck logs to reduce storage pressure
      - drop:
          expression: '.*(GET /health|healthcheck|rpk cluster health).*'
          drop_counter_reason: healthcheck_noise
